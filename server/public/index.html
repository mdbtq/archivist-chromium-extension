<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivist</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1b1e;
      --surface2: #25262b;
      --border: #2c2e33;
      --border2: #3d3f47;
      --text: #c1c2c5;
      --text-dim: #868e96;
      --text-muted: #5c5f66;
      --accent: #5c7cfa;
      --success: #51cf66;
      --danger: #ff6b6b;
      --url: #74c0fc;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .logo {
      font-size: 15px;
      font-weight: 700;
      color: #e8e9ea;
      letter-spacing: -0.4px;
      white-space: nowrap;
    }

    .logo-accent { color: var(--accent); }

    .header-stats {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* Filter bar */
    .filters {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      gap: 8px;
      align-items: center;
      position: sticky;
      top: 56px;
      z-index: 19;
    }

    .filter-select,
    .filter-search {
      padding: 7px 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    .filter-select { min-width: 190px; cursor: pointer; }
    .filter-search { flex: 1; max-width: 380px; }

    .filter-select:focus,
    .filter-search:focus { border-color: var(--accent); }

    .btn {
      padding: 7px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text-dim);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .btn:hover { background: var(--border); color: var(--text); }
    .btn.danger:hover {
      background: rgba(255, 107, 107, 0.12);
      border-color: rgba(255, 107, 107, 0.35);
      color: var(--danger);
    }

    /* Main content */
    .main {
      max-width: 860px;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Empty / loading states */
    .state-msg {
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .state-msg h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .state-msg p { font-size: 13px; }

    /* Archive card */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .card:hover { border-color: var(--border2); }

    .card-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .card-header:hover { background: rgba(255,255,255,0.025); }

    .chevron {
      color: var(--text-muted);
      font-size: 10px;
      flex-shrink: 0;
      transition: transform 0.2s;
    }

    .card.open .chevron { transform: rotate(180deg); }

    .domain-badge {
      background: rgba(92, 124, 250, 0.12);
      color: var(--accent);
      border: 1px solid rgba(92, 124, 250, 0.25);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card-label {
      font-size: 13px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .tab-count {
      background: var(--surface2);
      color: var(--text-dim);
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 11px;
      font-weight: 600;
    }

    .timestamp {
      color: var(--text-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    .card-actions {
      display: flex;
      gap: 4px;
    }

    /* Tab list */
    .tab-list {
      display: none;
      border-top: 1px solid var(--border);
    }

    .card.open .tab-list { display: block; }

    .tab-entry {
      padding: 7px 14px 7px 38px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s;
      border-bottom: 1px solid var(--border);
    }

    .tab-entry:last-child { border-bottom: none; }
    .tab-entry:hover { background: rgba(255,255,255,0.02); }

    .tab-fav {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      border-radius: 2px;
    }

    .tab-fav-placeholder {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--text);
    }

    .tab-link {
      color: var(--url);
      font-size: 11px;
      font-family: monospace;
      text-decoration: none;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
      flex-shrink: 0;
    }

    .tab-link:hover { text-decoration: underline; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      z-index: 100;
      animation: fadeUp 0.2s ease;
    }

    .toast.success { border-color: rgba(81, 207, 102, 0.45); color: var(--success); }
    .toast.error   { border-color: rgba(255, 107, 107, 0.45); color: var(--danger); }

    @keyframes fadeUp {
      from { transform: translateY(8px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 1; }
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  </style>
</head>
<body>

<div class="header">
  <span class="logo">▣ <span class="logo-accent">Archivist</span></span>
  <span class="header-stats" id="stats"></span>
</div>

<div class="filters">
  <select class="filter-select" id="domain-filter">
    <option value="">All domains</option>
  </select>
  <input type="text" class="filter-search" id="search" placeholder="Search titles or URLs…" autocomplete="off">
  <button class="btn" id="refresh-btn">↻ Refresh</button>
</div>

<div class="main" id="main">
  <div class="state-msg"><p>Loading…</p></div>
</div>

<script>
  let archives = [];

  // ── Helpers ──────────────────────────────────────────────

  function formatDate(iso) {
    const d = new Date(iso);
    const now = new Date();
    const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (d.toDateString() === now.toDateString()) return `Today at ${time}`;
    const yesterday = new Date(now - 86400000);
    if (d.toDateString() === yesterday.toDateString()) return `Yesterday at ${time}`;
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` at ${time}`;
  }

  function urlPath(url) {
    try {
      const p = new URL(url).pathname;
      return (p.length > 1 ? p : '/').slice(0, 48);
    } catch { return url.slice(0, 48); }
  }

  function safeHref(url) {
    try {
      const u = new URL(url);
      return (u.protocol === 'https:' || u.protocol === 'http:') ? url : '#';
    } catch { return '#'; }
  }

  function toast(msg, type = 'success') {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2600);
  }

  // ── DOM builders ─────────────────────────────────────────

  function buildTabEntry(tab) {
    const row = document.createElement('div');
    row.className = 'tab-entry';

    if (tab.favIconUrl) {
      const img = document.createElement('img');
      img.className = 'tab-fav';
      img.src = tab.favIconUrl;
      img.alt = '';
      img.onerror = () => {
        const ph = document.createElement('div');
        ph.className = 'tab-fav-placeholder';
        img.replaceWith(ph);
      };
      row.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'tab-fav-placeholder';
      row.appendChild(ph);
    }

    const title = document.createElement('span');
    title.className = 'tab-title';
    title.textContent = tab.title || tab.url;
    row.appendChild(title);

    const link = document.createElement('a');
    link.className = 'tab-link';
    link.href = safeHref(tab.url);
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.title = tab.url;
    link.textContent = urlPath(tab.url);
    row.appendChild(link);

    return row;
  }

  function buildCard(archive) {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = archive.id;

    // Header
    const header = document.createElement('div');
    header.className = 'card-header';

    const chevron = document.createElement('span');
    chevron.className = 'chevron';
    chevron.textContent = '▼';

    const badge = document.createElement('span');
    badge.className = 'domain-badge';
    badge.textContent = archive.domain;

    header.appendChild(chevron);
    header.appendChild(badge);

    if (archive.label) {
      const lbl = document.createElement('span');
      lbl.className = 'card-label';
      lbl.textContent = archive.label;
      header.appendChild(lbl);
    }

    const right = document.createElement('div');
    right.className = 'card-right';

    const count = document.createElement('span');
    count.className = 'tab-count';
    count.textContent = `${archive.tabs.length} tab${archive.tabs.length !== 1 ? 's' : ''}`;

    const ts = document.createElement('span');
    ts.className = 'timestamp';
    ts.textContent = formatDate(archive.timestamp);

    const actions = document.createElement('div');
    actions.className = 'card-actions';

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn';
    copyBtn.textContent = 'Copy URLs';
    copyBtn.onclick = e => { e.stopPropagation(); copyUrls(archive.id); };

    const openBtn = document.createElement('button');
    openBtn.className = 'btn';
    openBtn.textContent = 'Open all';
    openBtn.onclick = e => { e.stopPropagation(); openAll(archive.id); };

    const delBtn = document.createElement('button');
    delBtn.className = 'btn danger';
    delBtn.textContent = 'Delete';
    delBtn.onclick = e => { e.stopPropagation(); deleteArchive(archive.id); };

    actions.appendChild(copyBtn);
    actions.appendChild(openBtn);
    actions.appendChild(delBtn);

    right.appendChild(count);
    right.appendChild(ts);
    right.appendChild(actions);
    header.appendChild(right);

    header.onclick = () => card.classList.toggle('open');
    card.appendChild(header);

    // Tab list
    const list = document.createElement('div');
    list.className = 'tab-list';
    archive.tabs.forEach(t => list.appendChild(buildTabEntry(t)));
    card.appendChild(list);

    return card;
  }

  // ── Actions ──────────────────────────────────────────────

  async function copyUrls(id) {
    const archive = archives.find(a => a.id === id);
    if (!archive) return;
    await navigator.clipboard.writeText(archive.tabs.map(t => t.url).join('\n'));
    toast(`Copied ${archive.tabs.length} URL${archive.tabs.length !== 1 ? 's' : ''}`);
  }

  function openAll(id) {
    const archive = archives.find(a => a.id === id);
    if (!archive) return;
    if (archive.tabs.length > 10 && !confirm(`Open all ${archive.tabs.length} tabs?`)) return;
    archive.tabs.forEach(t => window.open(safeHref(t.url), '_blank', 'noopener'));
  }

  async function deleteArchive(id) {
    if (!confirm('Delete this archive?')) return;
    try {
      const res = await fetch(`/api/archives/${encodeURIComponent(id)}`, { method: 'DELETE' });
      if (!res.ok) throw new Error();
      archives = archives.filter(a => a.id !== id);
      updateStats();
      updateDomainFilter();
      applyFilter();
      toast('Archive deleted');
    } catch {
      toast('Failed to delete archive', 'error');
    }
  }

  // ── Filter & render ──────────────────────────────────────

  function applyFilter() {
    const domain = document.getElementById('domain-filter').value;
    const search = document.getElementById('search').value.toLowerCase().trim();

    const filtered = archives.filter(a => {
      if (domain && a.domain !== domain) return false;
      if (search) {
        const inDomain = a.domain.includes(search);
        const inLabel  = a.label?.toLowerCase().includes(search) ?? false;
        const inTabs   = a.tabs.some(
          t => t.title?.toLowerCase().includes(search) || t.url?.toLowerCase().includes(search)
        );
        if (!inDomain && !inLabel && !inTabs) return false;
      }
      return true;
    });

    const main = document.getElementById('main');
    main.replaceChildren();

    if (filtered.length === 0) {
      const msg = document.createElement('div');
      msg.className = 'state-msg';
      const h2 = document.createElement('h2');
      h2.textContent = archives.length === 0 ? 'No archives yet' : 'No results';
      const p = document.createElement('p');
      p.textContent = archives.length === 0
        ? 'Use the Archivist extension to save your first archive.'
        : 'Try adjusting your filters.';
      msg.appendChild(h2);
      msg.appendChild(p);
      main.appendChild(msg);
      return;
    }

    filtered.forEach(a => main.appendChild(buildCard(a)));
  }

  function updateStats() {
    const totalTabs = archives.reduce((s, a) => s + a.tabs.length, 0);
    document.getElementById('stats').textContent =
      `${archives.length} archive${archives.length !== 1 ? 's' : ''} · ${totalTabs} tab${totalTabs !== 1 ? 's' : ''}`;
  }

  function updateDomainFilter() {
    const sel = document.getElementById('domain-filter');
    const current = sel.value;
    const domains = [...new Set(archives.map(a => a.domain))].sort();

    sel.replaceChildren();
    const defaultOpt = document.createElement('option');
    defaultOpt.value = '';
    defaultOpt.textContent = 'All domains';
    sel.appendChild(defaultOpt);

    domains.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      if (d === current) opt.selected = true;
      sel.appendChild(opt);
    });
  }

  async function loadArchives() {
    try {
      const res = await fetch('/api/archives');
      archives = await res.json();
      updateStats();
      updateDomainFilter();
      applyFilter();
    } catch {
      const main = document.getElementById('main');
      main.replaceChildren();
      const msg = document.createElement('div');
      msg.className = 'state-msg';
      const h2 = document.createElement('h2');
      h2.textContent = 'Could not load archives';
      const p = document.createElement('p');
      p.textContent = `Make sure the server is running on ${location.host}.`;
      msg.appendChild(h2);
      msg.appendChild(p);
      main.appendChild(msg);
    }
  }

  document.getElementById('domain-filter').addEventListener('change', applyFilter);
  document.getElementById('search').addEventListener('input', applyFilter);
  document.getElementById('refresh-btn').addEventListener('click', loadArchives);

  loadArchives();
</script>
</body>
</html>
